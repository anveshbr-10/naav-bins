name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: API (tests + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Unit tests (rewards, redemptions, QR signing, balance writes)
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web app (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/smartbin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/smartbin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
