# Weekly dependency update pull requests. CI runs on each one before you merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client/smartbin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned by @teachablemachine/image; a major upgrade needs the scanner re-tested on phones.
      - dependency-name: "@tensorflow/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
